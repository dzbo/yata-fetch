name: Publish to NPM
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    # id-token: write lets npm exchange a GitHub OIDC token for a short-lived
    # publish credential (Trusted Publishing) — no NPM_TOKEN secret needed.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      # Node 24 ships npm 10.x; Trusted Publishing needs npm >=11.5.1.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      - name: Install
        run: pnpm install
      - name: Build 🔧
        run: pnpm build
      - name: Publish 📦
        run: npm publish
