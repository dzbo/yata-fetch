name: Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install

      - name: Lint Scripts
        run: pnpm lint:eslint

      - name: Lint Format
        run: pnpm lint:fmt

      - name: Lint Types
        run: pnpm lint:ts

      - name: Unit Test
        run: pnpm coverage

      # Runs even when the coverage thresholds fail, so the PR comment is
      # present precisely when coverage regressed.
      - name: Report Coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2.12.2

      - name: Build
        run: pnpm build
